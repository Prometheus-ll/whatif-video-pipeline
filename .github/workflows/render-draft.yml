name: Render visual draft

on:
  workflow_dispatch:
    inputs:
      scene_plan:
        description: "Scene plan JSON path in the repository"
        required: true
        default: "examples/earth-stops-spinning.json"

permissions:
  contents: read

concurrency:
  group: render-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          npm install --package-lock-only
          npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render first-person MP4 draft
        run: npm run render:draft -- "${{ inputs.scene_plan }}"
      - name: Verify MP4
        run: |
          test -s output/*/*.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of json output/*/*.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: whatif-visual-draft
          path: |
            output/**/*.mp4
            output/**/composition.html
            output/**/DRAFT-NOTES.txt
          if-no-files-found: error
          retention-days: 7
