<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What If — Earth Stopped Spinning?</title>
  <style>
    :root { color-scheme: dark; --ink:#f4f6fb; --muted:#a9b4c7; --cyan:#76e4f7; --amber:#ffca78; }
    * { box-sizing: border-box; }
    html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#050914; color:var(--ink); font-family:Inter,Arial,sans-serif; }
    #root { position:relative; width:1080px; height:1920px; overflow:hidden; background:radial-gradient(ellipse at 48% 34%,#15324b 0%,#091523 33%,#050914 72%); }
    .starfield { position:absolute; inset:0; opacity:.6; background-image:radial-gradient(2px 2px at 12% 17%,#fff 50%,transparent 100%),radial-gradient(1px 1px at 82% 22%,#fff 50%,transparent 100%),radial-gradient(2px 2px at 72% 61%,#b8e9ff 50%,transparent 100%),radial-gradient(1px 1px at 27% 70%,#fff 50%,transparent 100%),radial-gradient(1px 1px at 91% 80%,#fff 50%,transparent 100%),radial-gradient(1px 1px at 39% 11%,#fff 50%,transparent 100%); }
    .topline { position:absolute; left:76px; top:86px; right:76px; display:flex; justify-content:space-between; font-size:22px; letter-spacing:5px; color:var(--cyan); font-weight:700; }
    .eyebrow { font-size:24px; letter-spacing:6px; color:var(--amber); font-weight:700; text-transform:uppercase; }
    .title { position:absolute; left:76px; right:76px; top:280px; font-size:91px; line-height:.98; font-weight:900; letter-spacing:-4px; text-transform:uppercase; text-shadow:0 8px 45px #000; }
    .title span { color:var(--cyan); }
    .earth { position:absolute; width:680px; height:680px; border-radius:50%; top:630px; left:200px; background:radial-gradient(circle at 30% 27%,#9be8f6 0%,#2978a0 17%,#12344f 43%,#071222 68%); box-shadow:inset -65px -40px 110px #020611,0 0 90px #2b9fcb66,0 0 190px #1872a044; }
    .earth:before { content:""; position:absolute; inset:0; border-radius:50%; background:repeating-linear-gradient(25deg,transparent 0 45px,#c6f2ff14 47px 50px,transparent 53px 83px); clip-path:polygon(0 20%,45% 7%,64% 30%,88% 23%,100% 48%,78% 68%,53% 59%,40% 93%,10% 75%); }
    .earth:after { content:""; position:absolute; inset:-10px; border:2px solid #8beaff7a; border-radius:50%; }
    .orbit { position:absolute; left:95px; top:800px; width:890px; height:340px; border:2px solid #76e4f744; border-radius:50%; transform:rotate(-22deg); }
    .callout { position:absolute; left:76px; right:76px; top:1390px; padding:32px 34px; border-left:5px solid var(--cyan); background:linear-gradient(90deg,#76e4f71a,transparent); }
    .callout .label { font-size:22px; color:var(--cyan); letter-spacing:4px; font-weight:800; }
    .callout .copy { margin-top:18px; font-size:38px; line-height:1.22; font-weight:700; }
    .timeline { position:absolute; left:76px; right:76px; top:1625px; }
    .timeline-head { display:flex; justify-content:space-between; font-size:20px; color:var(--muted); letter-spacing:3px; text-transform:uppercase; }
    .track { height:5px; background:#29364a; margin-top:25px; position:relative; }
    .progress { position:absolute; inset:0 auto 0 0; width:22%; background:var(--cyan); box-shadow:0 0 18px #76e4f7; }
    .ticks { display:flex; justify-content:space-between; margin-top:17px; font-size:18px; color:#d3dbea; }
    .footer { position:absolute; bottom:68px; left:76px; right:76px; display:flex; justify-content:space-between; font-size:18px; letter-spacing:3px; color:#8e9cb1; }
    .clip { position:absolute; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="whatif-cinematic-timeline" data-start="0" data-width="1080" data-height="1920">
    <div class="starfield"></div>
    <div class="topline"><span>WHAT IF / 001</span><span>SCIENCE · SPECULATION</span></div>
    <div class="orbit"></div>
    <div class="earth"></div>
    <div class="title"><div>What if Earth</div><div><span>stopped</span></div><div>spinning?</div></div>
    <div class="callout">
      <div class="label">THE FIRST MOMENTS</div>
      <div class="copy">The ground stops.<br>Momentum doesn't.</div>
    </div>
    <div class="timeline">
      <div class="timeline-head"><span>Hypothetical timeline</span><span>00:05 / 00:45</span></div>
      <div class="track"><div class="progress"></div></div>
      <div class="ticks"><span>NOW</span><span>SECONDS</span><span>HOURS</span><span>YEARS</span></div>
    </div>
    <div class="footer"><span>THOUGHT EXPERIMENT · NOT A FORECAST</span><span>WHAT IF…?</span></div>
    <div class="clip" data-start="0" data-duration="45" data-track-index="0" style="inset:0;pointer-events:none;"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.from(".title", { opacity: 0, y: 65, duration: 1.2, ease: "power3.out" }, 0.25);
    tl.from(".earth", { opacity: 0, scale: 0.84, duration: 1.8, ease: "power2.out" }, 0.15);
    tl.from(".orbit", { opacity: 0, scaleX: 0.8, duration: 1.5, ease: "power2.out" }, 0.5);
    tl.from(".callout", { opacity: 0, x: -35, duration: 0.8, ease: "power2.out" }, 2.1);
    tl.from(".timeline", { opacity: 0, y: 18, duration: 0.8 }, 2.6);
    tl.to(".earth", { rotation: 8, duration: 10, ease: "sine.inOut", yoyo: true, repeat: 2 }, 4);
    tl.to(".progress", { width: "100%", duration: 45, ease: "none" }, 0);
    tl.to(".earth", { scale: 1.035, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 4);
    window.__timelines = window.__timelines || {};
    window.__timelines["whatif-cinematic-timeline"] = tl;
  </script>
</body>
</html>
